name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, tests y cobertura
    runs-on: ubuntu-latest
    # Mismo entorno que el de desarrollo (g++ 15, Qt 6.10); los runners traen Qt 6.4
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Instalar dependencias
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config ca-certificates gcovr \
            libopus-dev libopusfile-dev libxmp-dev libfluidsynth-dev libwavpack-dev libfreetype-dev \
            qt6-base-dev qt6-tools-dev qt6-l10n-tools qt6-multimedia-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev

      - uses: actions/checkout@v5

      # SDL2, yaml-cpp, box2d, json y gtest los baja FetchContent
      - name: Cache de dependencias de CMake
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # Igual que install_assets() de installer.sh; sin esto se saltean los tests de SDL
      - name: Instalar assets en /var/nfs
        run: |
          mkdir -p /var/nfs/assets /var/nfs/races /var/nfs/world
          cp -r client/assets/* /var/nfs/assets/
          cp -r server/races/* /var/nfs/races/
          cp -r server/world/* /var/nfs/world/

      # La CMake 4 de Ubuntu 26.04 rechaza deps que piden cmake_minimum_required < 3.5 (yaml-cpp 0.8.0).
      # El backend PipeWire de SDL 2.30 no compila con los headers de PipeWire de 26.04 + GCC 15;
      # los tests corren sin audio real, así que se desactiva.
      - name: Compilar, correr tests y generar cobertura
        run: >
          make test
          EXTRA_GENERATE="-DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DSDL_PIPEWIRE=OFF"
          EXTRA_COMPILE="-j$(nproc)"

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: build/report/
          if-no-files-found: ignore

  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar cppcheck y pre-commit
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          pip install pre-commit

      - name: Cache de pre-commit
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Correr hooks
        run: pre-commit run --all-files --show-diff-on-failure
