sonar.organization=mateozorzi
sonar.projectKey=mateozorzi_practice-sdd

# Codigo a analizar; los tests van aparte y no cuentan como lineas de codigo
sonar.sources=client,server,common,editor
sonar.tests=tests

# Excluir archivos JSON, dependencias y carpetas de compilación
sonar.exclusions=**/*.json, **/build/**, **/dist/**, **/vendor/**

# Base de compilacion para el analisis de C++ (generada por CMake)
sonar.cfamily.compile-commands=build/compile_commands.json

# Reporte de cobertura generado por gcovr con `make test`
sonar.coverageReportPaths=build/coverage.xml

# cpp:S2245 (generador pseudoaleatorio): solo se usa para el juego
# (power-ups, musica, salas, temblor de camara), nunca para seguridad
sonar.issue.ignore.multicriteria=rand
sonar.issue.ignore.multicriteria.rand.ruleKey=cpp:S2245
sonar.issue.ignore.multicriteria.rand.resourceKey=**/*
